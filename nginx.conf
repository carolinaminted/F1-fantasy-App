server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # nginx does NOT inherit server-level add_header into a location that declares its
    # own, so every header is repeated in each block below. The crawler-blocking header
    # stays on its own line in each block because the Dockerfile deletes those lines by
    # pattern for production builds.

    # Vite emits content-hashed filenames here, so a given URL's bytes never change.
    # `=404` instead of the SPA fallback: a stale index.html asking for a chunk that no
    # longer exists should fail loudly, not receive index.html with a 200 and then blow
    # up in the JS parser.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must revalidate on every load. Without this it is heuristically cached,
    # and a returning member can hold an index.html pointing at chunks a newer deploy has
    # already removed. `no-cache` still allows a cheap 304 via ETag.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
